<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ESTHER 不二的工具库。">
  <title>ESTHER 不二</title>
  <style>
    :root { --cream: #fefcf6; --blue: #2b7fd8; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; overflow-x: hidden; background: var(--cream); }
    .hero { position: relative; width: min(100vw, 1324px); aspect-ratio: 1324 / 886; line-height: 0; }
    .hero-image { display: block; width: 100%; height: 100%; object-fit: contain; }
    .hotspot { position: absolute; z-index: 2; display: block; border: 0; outline: 0; background: transparent; cursor: pointer; line-height: normal; }
    .hotspot::after { content: ""; position: absolute; inset: 0; border: 3px solid transparent; transition: border-color .15s ease, background-color .15s ease; }
    .hotspot:hover::after, .hotspot:focus-visible::after { border-color: var(--blue); background: rgba(43,127,216,.08); }
    .hotspot-tomato { left: 15.5%; top: 38.5%; width: 16%; height: 29%; }
    .hotspot-book { left: 62.5%; top: 65%; width: 22%; height: 35%; }
    .hotspot-credit { left: 43.5%; top: 91.5%; width: 13%; height: 5%; }
    .hotspot-label { left: 79.5%; top: 47%; width: 9%; height: 4.5%; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-aspect-ratio: 1324 / 886) { body { align-items: start; } .hero { width: 100vw; margin-top: max(0px, calc((100vh - (100vw * .6692)) / 2)); } }
    @media (prefers-reduced-motion: reduce) { .hotspot::after { transition-duration: .01ms; } }
  </style>
</head>
<body>
  <main class="hero" aria-label="ESTHER 不二主站 Hero">
    <img class="hero-image" src="./assets/hero/current-hero.png" alt="Hi check out Esther's tools for content">
    <a class="hotspot hotspot-tomato" href="https://hiesther.com/write/" aria-label="打开写了就发"><span class="sr-only">番茄：打开写了就发</span></a>
    <a class="hotspot hotspot-book" href="https://hiesther.com/pic/" aria-label="打开不二的小画框"><span class="sr-only">书本：打开不二的小画框</span></a>
    <a class="hotspot hotspot-credit" href="https://x.com/SjwEsther" target="_blank" rel="noopener noreferrer" aria-label="打开 X 上的 SjwEsther"><span class="sr-only">@SjwEsther：打开 X</span></a>
    <a class="hotspot hotspot-label" href="https://x.com/SjwEsther" target="_blank" rel="noopener noreferrer" aria-label="打开 X 上的 SjwEsther"><span class="sr-only">SjwEsther：打开 X</span></a>
  </main>
</body>
</html>
